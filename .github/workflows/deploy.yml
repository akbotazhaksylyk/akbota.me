name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'alpine/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r alpine/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('alpine/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Cache Alpine rootfs flat files
        uses: actions/cache@v4
        with:
          path: dist/alpine-rootfs-flat
          key: ${{ runner.os }}-rootfs-flat-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rootfs-flat-

      - name: Build Alpine rootfs
        env:
          DOCKER_CACHE_DIR: /tmp/.buildx-cache
        run: |
          cd alpine
          ./build.sh
          # Move cache to preserve it for next run
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: Build Alpine state
        run: |
          cd alpine
          ./build-state.js

      - name: Compress state file
        run: zstd -kf dist/alpine-state.bin

      - name: Cleanup unused cached files
        run: |
          cd alpine
          ./cleanup-cache.py ../dist/alpine-fs.json ../dist/alpine-rootfs-flat

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
